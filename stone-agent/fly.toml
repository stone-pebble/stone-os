# Fly.io Configuration
# Run: fly launch --config fly.toml

app = "stone-agent"
primary_region = "ord" # Chicago - change to your preferred region

[build]
  [build.args]
    NODE_VERSION = "20"

[env]
  NODE_ENV = "production"
  TOKEN_SERVER_PORT = "8000"
  AGENT_PORT = "8081"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[mounts]
  source = "stone_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8081
  processes = ["agent"]

  [[services.ports]]
    port = 8081

# Resource allocation
[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Scaling configuration
[scaling]
  min_machines = 1
  max_machines = 3
